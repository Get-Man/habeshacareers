<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Listings - Habesha Careers</title>
    <meta name="description" content="Search and filter current job vacancies across Ethiopia by category, location, job type and deadline.">
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet" href="css/app.css">
</head>
<body data-page="jobs">
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div id="app-header"></div>

    <main id="main-content">
        <section class="jobs-page">
            <div class="container">
                <h1 class="page-title">Available Job Opportunities</h1>
                <p class="page-subtitle">Browse the latest vacancies and narrow them down to fit your skills and location.</p>

                <div class="jobs-layout" id="jobsLayout">
                    <button type="button" class="filters-toggle" id="filtersToggle" aria-expanded="false" aria-controls="jobsFilters">Categories &amp; Filters</button>

                    <aside class="filters" id="jobsFilters" aria-label="Filter jobs">
                        <h2 class="card-title">Filter Jobs</h2>

                        <div class="filter-group">
                            <label for="categoryFilter">Category</label>
                            <select id="categoryFilter" class="form-control">
                                <option value="">All Categories</option>
                                <option value="Healthcare and Medical">Healthcare and Medical</option>
                                <option value="Information Technology">Information Technology and Computer Science</option>
                                <option value="Education and Training">Education and Training</option>
                                <option value="Engineering and Technical">Engineering and Technical</option>
                                <option value="Finance and Accounting">Finance and Accounting</option>
                                <option value="Business and Management">Business and Management</option>
                                <option value="Creative and Design">Creative and Design</option>
                                <option value="Law and Public Safety">Law and Public Safety</option>
                                <option value="Science and Research">Science and Research</option>
                                <option value="Hospitality and Tourism">Hospitality and Tourism</option>
                                <option value="Manufacturing and Skilled Trades">Manufacturing and Skilled Trades</option>
                                <option value="Agriculture and Natural Resources">Agriculture and Natural Resources</option>
                                <option value="Transportation and Logistics">Transportation and Logistics</option>
                                <option value="Media and Communication">Media and Communication</option>
                            </select>
                        </div>

                        <div class="filter-group">
                            <label for="locationFilter">Location</label>
                            <select id="locationFilter" class="form-control">
                                <option value="">All Locations</option>
                                <optgroup label="Addis Ababa">
                                    <option value="Addis Ababa">Addis Ababa</option>
                                </optgroup>
                                <optgroup label="Afar Region">
                                    <option value="Semera">Semera</option>
                                    <option value="Asayita">Asayita</option>
                                    <option value="Dubti">Dubti</option>
                                </optgroup>
                                <optgroup label="Amhara Region">
                                    <option value="Bahir Dar">Bahir Dar</option>
                                    <option value="Gondar">Gondar</option>
                                    <option value="Dessie">Dessie</option>
                                    <option value="Debre Birhan">Debre Birhan</option>
                                    <option value="Debre Markos">Debre Markos</option>
                                    <option value="Debre Tabor">Debre Tabor</option>
                                    <option value="Weldiya">Weldiya</option>
                                    <option value="Sekota">Sekota</option>
                                    <option value="Kemise">Kemise</option>
                                    <option value="Shewa Robit">Shewa Robit</option>
                                    <option value="Ankober">Ankober</option>
                                    <option value="Injibara">Injibara</option>
                                    <option value="Finote Selam">Finote Selam</option>
                                </optgroup>
                                <optgroup label="Benishangul-Gumuz">
                                    <option value="Asosa">Asosa</option>
                                    <option value="Kamashi">Kamashi</option>
                                </optgroup>
                                <optgroup label="Dire Dawa">
                                    <option value="Dire Dawa">Dire Dawa</option>
                                </optgroup>
                                <optgroup label="Gambela Region">
                                    <option value="Gambela">Gambela</option>
                                    <option value="Akobo">Akobo</option>
                                    <option value="Jikawo">Jikawo</option>
                                    <option value="Lare">Lare</option>
                                    <option value="Gog">Gog</option>
                                </optgroup>
                                <optgroup label="Harari Region">
                                    <option value="Harar">Harar</option>
                                </optgroup>
                                <optgroup label="Oromia Region">
                                    <option value="Adama">Adama</option>
                                    <option value="Bishoftu">Bishoftu</option>
                                    <option value="Jimma">Jimma</option>
                                    <option value="Nekemte">Nekemte</option>
                                    <option value="Chiro">Chiro</option>
                                    <option value="Asella">Asella</option>
                                    <option value="Robe">Robe</option>
                                    <option value="Goba">Goba</option>
                                    <option value="Shashamane">Shashamane</option>
                                    <option value="Bule Hora">Bule Hora</option>
                                    <option value="Yabelo">Yabelo</option>
                                    <option value="Moyale">Moyale</option>
                                    <option value="Negele Borana">Negele Borana</option>
                                    <option value="Metu">Metu</option>
                                    <option value="Bedele">Bedele</option>
                                    <option value="Gimbi">Gimbi</option>
                                    <option value="Dembidolo">Dembidolo</option>
                                    <option value="Shambu">Shambu</option>
                                </optgroup>
                                <optgroup label="Sidama Region">
                                    <option value="Hawassa">Hawassa</option>
                                    <option value="Aleta Wondo">Aleta Wondo</option>
                                    <option value="Dilla">Dilla</option>
                                    <option value="Yirgalem">Yirgalem</option>
                                    <option value="Chuko">Chuko</option>
                                    <option value="Loka Abaya">Loka Abaya</option>
                                </optgroup>
                                <optgroup label="Somali Region">
                                    <option value="Jijiga">Jijiga</option>
                                    <option value="Gode">Gode</option>
                                    <option value="Kebri Dehar">Kebri Dehar</option>
                                    <option value="Fiq">Fiq</option>
                                    <option value="Degehabur">Degehabur</option>
                                    <option value="Shinile">Shinile</option>
                                    <option value="Dollo Ado">Dollo Ado</option>
                                    <option value="Warder">Warder</option>
                                </optgroup>
                                <optgroup label="Central Ethiopia Regional State">
                                    <option value="Butajira">Butajira</option>
                                    <option value="Welkite">Welkite</option>
                                    <option value="Hosaena">Hosaena</option>
                                    <option value="Halaba Kulito">Halaba Kulito</option>
                                    <option value="Durame">Durame</option>
                                    <option value="Worabe">Worabe</option>
                                </optgroup>
                                <optgroup label="South Ethiopia Regional State">
                                    <option value="Wolaita Sodo">Wolaita Sodo</option>
                                    <option value="Arba Minch">Arba Minch</option>
                                    <option value="Sawla">Sawla</option>
                                    <option value="Jinka">Jinka</option>
                                </optgroup>
                                <optgroup label="South West Ethiopia Peoples' Region">
                                    <option value="Bonga">Bonga</option>
                                    <option value="Mizan Teferi">Mizan Teferi</option>
                                    <option value="Tepi">Tepi</option>
                                    <option value="Tarcha">Tarcha</option>
                                </optgroup>
                                <optgroup label="Tigray Region">
                                    <option value="Mekelle">Mekelle</option>
                                    <option value="Adigrat">Adigrat</option>
                                    <option value="Axum">Axum</option>
                                    <option value="Shire">Shire</option>
                                    <option value="Wukro">Wukro</option>
                                    <option value="Alamata">Alamata</option>
                                    <option value="Maychew">Maychew</option>
                                    <option value="Korem">Korem</option>
                                    <option value="Abi Adi">Abi Adi</option>
                                    <option value="Humera">Humera</option>
                                </optgroup>
                            </select>
                        </div>

                        <div class="filter-group">
                            <label for="typeFilter">Job Type</label>
                            <select id="typeFilter" class="form-control">
                                <option value="">All Types</option>
                                <option value="Full-time / Permanent">Full-time / Permanent</option>
                                <option value="Part-time">Part-time</option>
                                <option value="Contract / Fixed-term">Contract / Fixed-term</option>
                                <option value="Temporary / Casual">Temporary / Casual</option>
                                <option value="Freelance / Independent Contractor">Freelance / Independent Contractor</option>
                                <option value="Internship / Apprenticeship">Internship / Apprenticeship</option>
                            </select>
                        </div>

                        <div class="filter-group">
                            <label for="sortFilter">Sort By</label>
                            <select id="sortFilter" class="form-control">
                                <option value="newest">Newest First</option>
                                <option value="deadline">Deadline Soon</option>
                            </select>
                        </div>

                        <div class="filter-actions">
                            <button type="button" id="applyFiltersBtn" class="btn btn-primary" data-filter-apply>Apply Filters</button>
                            <button type="button" id="clearFiltersBtn" class="btn btn-secondary" data-filter-clear>Clear</button>
                        </div>
                    </aside>

                    <div class="jobs-content">
                        <div class="search-bar" role="search">
                            <div class="search-input-wrapper">
                                <input type="search" id="jobSearch" aria-label="Search jobs by title or keyword" placeholder="Search jobs by title or keyword...">
                            </div>
                            <button type="button" id="jobSearchBtn" class="btn btn-primary" data-search-submit>Search</button>
                        </div>
                        <div id="jobsCount" class="jobs-count" role="status" aria-live="polite"></div>
                        <div id="jobsList" class="jobs-list">
                            <div class="empty-state">Loading jobs…</div>
                        </div>
                        <div id="pagination" class="pagination"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="app-footer"></div>
    <script src="js/app.js" defer></script>
    <script src="js/pages.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Dashboard - Habesha Careers</title>
    <meta name="description" content="Your Habesha Careers account dashboard.">
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet" href="css/app.css">
</head>
<body data-page="dashboard" data-roles="admin employee employer">
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div id="app-header"></div>

    <main id="main-content">
        <section class="jobs-page dashboard-page">
            <div class="container">
                <h1 class="page-title">Your Dashboard</h1>

                <div id="dashboardLoading" class="empty-state">Loading your dashboard…</div>
                <div id="dashboardError" class="alert alert-error" role="alert" hidden></div>

                <div id="dashboardContent" hidden>
                    <div class="card page-header dashboard-header">
                        <h2 id="dashboardWelcome">Welcome</h2>
                        <p id="dashboardSubtitle">Here's a snapshot of your Habesha Careers account.</p>
                        <p><span id="dashboardRoleBadge" class="chip badge badge-neutral"></span></p>
                    </div>

                    <div class="grid grid-2 dashboard-grid">
                        <div class="card card-hover">
                            <h2 class="card-title">Profile completion</h2>
                            <div id="completionContent">
                                <div class="empty-state">Checking your profile…</div>
                            </div>
                            <p><a href="account.html" class="btn btn-secondary btn-sm">Edit profile</a></p>
                        </div>

                        <div class="card card-hover">
                            <h2 class="card-title">Account &amp; sessions</h2>
                            <div id="accountSummary">
                                <div class="empty-state">Loading account details…</div>
                            </div>
                            <p><a href="account.html" class="btn btn-secondary btn-sm">Account settings</a></p>
                        </div>
                    </div>

                    <div class="dashboard-actions">
                        <h2 class="section-title">Quick actions</h2>
                        <div id="quickActions" class="grid grid-3"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="app-footer"></div>
    <script src="js/app.js" defer></script>
    <script src="js/pages.js" defer></script>
</body>
</html>

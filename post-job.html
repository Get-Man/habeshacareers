<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Job - Habesha Careers</title>
    <meta name="description" content="Employers can submit a job opening for review and publication on Habesha Careers.">
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet" href="css/app.css">
</head>
<body data-page="post-job" data-roles="employer admin">
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div id="app-header"></div>

    <main id="main-content">
        <section class="post-job">
            <div class="container">
                <h1 class="page-title">Post a Job Opportunity</h1>
                <p class="page-subtitle">Fill out the form below to submit your job opening for review.</p>

                <div class="card">
                    <div id="postJobMessage" class="alert alert-error" role="alert" hidden></div>
                    <form id="postJobForm" class="job-form">
                        <div class="form-group">
                            <label for="jobTitle">Job Title *</label>
                            <input type="text" id="jobTitle" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label for="company">Company / Organisation *</label>
                            <input type="text" id="company" class="form-control" required>
                        </div>

                        <div class="grid grid-2 form-row">
                            <div class="form-group">
                                <label for="category">Category *</label>
                                <select id="category" class="form-control" required>
                                    <option value="">Select Category</option>
                                    <option value="Healthcare and Medical">Healthcare and Medical</option>
                                    <option value="Information Technology">Information Technology and Computer Science</option>
                                    <option value="Education and Training">Education and Training</option>
                                    <option value="Engineering and Technical">Engineering and Technical</option>
                                    <option value="Finance and Accounting">Finance and Accounting</option>
                                    <option value="Business and Management">Business and Management</option>
                                    <option value="Creative and Design">Creative and Design</option>
                                    <option value="Law and Public Safety">Law and Public Safety</option>
                                    <option value="Science and Research">Science and Research</option>
                                    <option value="Hospitality and Tourism">Hospitality and Tourism</option>
                                    <option value="Manufacturing and Skilled Trades">Manufacturing and Skilled Trades</option>
                                    <option value="Agriculture and Natural Resources">Agriculture and Natural Resources</option>
                                    <option value="Transportation and Logistics">Transportation and Logistics</option>
                                    <option value="Media and Communication">Media and Communication</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="jobType">Job Type *</label>
                                <select id="jobType" class="form-control" required>
                                    <option value="">Select Type</option>
                                    <option value="Full-time / Permanent">Full-time / Permanent</option>
                                    <option value="Part-time">Part-time</option>
                                    <option value="Contract / Fixed-term">Contract / Fixed-term</option>
                                    <option value="Temporary / Casual">Temporary / Casual</option>
                                    <option value="Freelance / Independent Contractor">Freelance / Independent Contractor</option>
                                    <option value="Internship / Apprenticeship">Internship / Apprenticeship</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid grid-2 form-row">
                            <div class="form-group">
                                <label for="location">Location *</label>
                                <input type="text" id="location" class="form-control" placeholder="e.g. Addis Ababa" required>
                            </div>
                            <div class="form-group">
                                <label for="vacancies">Number of Positions *</label>
                                <input type="number" id="vacancies" class="form-control" min="1" value="1" required>
                            </div>
                        </div>

                        <div class="grid grid-2 form-row">
                            <div class="form-group">
                                <label for="deadline">Application Deadline *</label>
                                <input type="date" id="deadline" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label for="contactEmail">Contact Email *</label>
                                <input type="email" id="contactEmail" class="form-control" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="description">Job Description *</label>
                            <textarea id="description" class="form-control" rows="6" required></textarea>
                        </div>

                        <div class="form-group">
                            <label for="requirements">Requirements *</label>
                            <textarea id="requirements" class="form-control" rows="6" required></textarea>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">Submit Job</button>
                            <button type="reset" class="btn btn-secondary">Clear Form</button>
                        </div>
                    </form>

                    <div id="successMessage" class="alert alert-success success-message" role="status" hidden>
                        <h2>Job submitted successfully</h2>
                        <p>Your job posting has been submitted and will be reviewed shortly.</p>
                        <p><a href="post-job.html" class="btn btn-primary">Post Another Job</a></p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="app-footer"></div>
    <script src="js/app.js" defer></script>
    <script src="js/pages.js" defer></script>
</body>
</html>
